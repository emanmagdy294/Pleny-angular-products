<div class="sidebar">

    <h3>Products</h3>

    <label class="category-item">
        <input type="radio" name="category" checked (change)="selectCategory('all')">

        <span>All</span>
    </label>


    @for(category of categories(); track category){

    <label class="category-item">

        <input type="radio" name="category" (change)="selectCategory(category)">

        <span>{{ category }}</span>

    </label>

    }

</div>
